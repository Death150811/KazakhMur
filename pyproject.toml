[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qazaq"
version = "0.2.0"
description = "Qazaq — язык программирования на казахском языке"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
science = ["sympy>=1.12", "matplotlib>=3.7"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qaz = "qaz.cli:main"

[tool.setuptools.packages.find]
include = ["qaz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
